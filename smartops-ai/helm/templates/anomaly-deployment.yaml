{{- if .Values.anomaly.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smartops.fullname" . }}-anomaly
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "smartops.labels" . | nindent 4 }}
    app: smartops-anomaly
spec:
  replicas: {{ .Values.anomaly.replicaCount }}
  selector:
    matchLabels:
      app: smartops-anomaly
  template:
    metadata:
      labels:
        app: smartops-anomaly
        {{- include "smartops.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.anomaly.serviceAccount.name }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: fastapi
          image: {{ .Values.anomaly.image.repository }}:{{ .Values.anomaly.image.tag }}
          imagePullPolicy: {{ .Values.anomaly.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- if .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- end }}
          {{- if .Values.anomaly.resources }}
          resources:
            {{- toYaml .Values.anomaly.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.dashboard.persistence.enabled }}
          volumeMounts:
            - name: dashboard-data
              mountPath: /app/dashboard/data
          {{- end }}
        - name: anomaly-loop
          image: {{ .Values.anomaly.image.repository }}:{{ .Values.anomaly.image.tag }}
          imagePullPolicy: {{ .Values.anomaly.image.pullPolicy }}
          command: ["python", "app/anomaly_loop.py"]
          env:
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_CONTAINER_NAME
              value: fastapi
            - name: DASHBOARD_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "smartops.fullname" . }}-config
                  key: DASHBOARD_INTERNAL_URL
          {{- if .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- end }}
          {{- if .Values.anomaly.resources }}
          resources:
            {{- toYaml .Values.anomaly.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.dashboard.persistence.enabled }}
          volumeMounts:
            - name: dashboard-data
              mountPath: /app/dashboard/data
          {{- end }}
      {{- if .Values.dashboard.persistence.enabled }}
      volumes:
        - name: dashboard-data
          persistentVolumeClaim:
            claimName: {{ include "smartops.fullname" . }}-dashboard-pvc
      {{- end }}
{{- end }}
