{{- if .Values.anomaly.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smartops.fullname" . }}-anomaly-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "smartops.labels" . | nindent 4 }}
    app: smartops-anomaly
spec:
  type: {{ .Values.anomaly.service.type }}
  selector:
    app: smartops-anomaly
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.anomaly.service.port }}
      targetPort: {{ .Values.anomaly.service.targetPort }}
{{- end }}
