apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smartops.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "smartops.labels" . | nindent 4 }}
data:
  DASHBOARD_INTERNAL_URL: {{ .Values.config.dashboard.internalUrl }}
  DASHBOARD_EXTERNAL_URL: {{ .Values.config.dashboard.externalUrl }}
