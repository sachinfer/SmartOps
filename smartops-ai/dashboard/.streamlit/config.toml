[global]
developmentMode = false

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
runOnSave = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#667eea"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1e2127"
textColor = "#fafafa"
font = "sans serif"

[client]
showErrorDetails = true

[layout]
wideMode = true

[runner]
fastReruns = true
