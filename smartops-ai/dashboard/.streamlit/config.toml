[global]
developmentMode = false

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
runOnSave = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#667eea"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1e2127"
textColor = "#fafafa"
font = "sans serif"

[client]
showErrorDetails = true

[layout]
wideMode = true

[runner]
fastReruns = true

[ui]
globalCustomCode = """
<style>
/* Global CSS override for maximum full-width */
* {
    max-width: 100vw !important;
    width: auto !important;
}

.main .block-container {
    max-width: 100vw !important;
    width: 100vw !important;
    padding: 0 !important;
    margin: 0 !important;
}

.stApp > div {
    max-width: 100vw !important;
    width: 100vw !important;
}
</style>
"""
