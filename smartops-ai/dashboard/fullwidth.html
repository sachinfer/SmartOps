<!DOCTYPE html>
<html>
<head>
    <style>
        /* ULTRA-AGGRESSIVE FULL-WIDTH CSS */
        * {
            max-width: none !important;
            box-sizing: border-box !important;
        }
        
        html, body {
            width: 100vw !important;
            max-width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
        }
        
        .stApp {
            width: 100vw !important;
            max-width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .main {
            width: 100vw !important;
            max-width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
            flex: 1 !important;
        }
        
        .block-container,
        .main .block-container,
        [data-testid="stAppViewContainer"],
        .stApp > div[data-testid="stAppViewContainer"] {
            width: 100vw !important;
            max-width: 100vw !important;
            margin: 0 !important;
            padding: 0.5rem !important;
            box-sizing: border-box !important;
        }
        
        .stMarkdown,
        .stDataFrame,
        .stMetric,
        .stColumns,
        .stTable,
        .stSelectbox,
        .stButton,
        .stTextInput,
        .stTextArea,
        .stNumberInput,
        .stSlider,
        .stCheckbox,
        .stRadio,
        .stMultiselect,
        .stDateInput,
        .stTimeInput,
        .stFileUploader,
        .stColorPicker,
        .stPlotlyChart,
        .stAltairChart,
        .stVegaLiteChart,
        .stPyplot,
        .stBokehChart,
        .stGraphvizChart,
        .stMap,
        .stImage,
        .stVideo,
        .stAudio,
        .stDownloadButton,
        .stProgress,
        .stSpinner,
        .stBalloons,
        .stSnow,
        .stError,
        .stWarning,
        .stInfo,
        .stSuccess,
        .stException,
        .stHelp,
        .stCode,
        .stJson,
        .stSidebar {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }
        
        .stColumns > div {
            width: 100% !important;
            max-width: 100% !important;
            flex: 1 !important;
            box-sizing: border-box !important;
        }
        
        .stTable table {
            width: 100% !important;
            max-width: 100% !important;
        }
        
        :root {
            --main-width: 100vw !important;
            --max-width: 100vw !important;
            --content-width: 100vw !important;
            --sidebar-width: 20rem !important;
        }
        
        .stApp > * {
            width: 100vw !important;
            max-width: 100vw !important;
        }
        
        .stApp > div > div {
            width: 100vw !important;
            max-width: 100vw !important;
        }
        
        .stApp {
            overflow-x: hidden !important;
        }
        
        html {
            width: 100vw !important;
            max-width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .reportview-container .main .block-container {
            width: 100vw !important;
            max-width: 100vw !important;
            padding-left: 0.5rem !important;
            padding-right: 0.5rem !important;
        }
        
        .wide .block-container {
            width: 100vw !important;
            max-width: 100vw !important;
        }
        
        .stMarkdown > div,
        .stDataFrame > div,
        .stTable > div {
            width: 100% !important;
            max-width: 100% !important;
        }
        
        .metric-card {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }
        
        .nav-card {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }
        
        .stMarkdown {
            margin-bottom: 1rem;
        }
        
        .stAlert {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .stTable {
            width: 100% !important;
        }
        
        .stPlotlyChart, .stAltairChart, .stVegaLiteChart {
            width: 100% !important;
        }
    </style>
</head>
<body>
    <!-- This file contains the CSS for full-width layout -->
</body>
</html>
