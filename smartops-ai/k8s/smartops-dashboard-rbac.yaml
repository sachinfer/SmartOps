apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-metrics-reader
  namespace: smartops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-metrics-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-metrics-reader
subjects:
  - kind: ServiceAccount
    name: dashboard-metrics-reader
    namespace: smartops
roleRef:
  kind: ClusterRole
  name: dashboard-metrics-reader
  apiGroup: rbac.authorization.k8s.io 