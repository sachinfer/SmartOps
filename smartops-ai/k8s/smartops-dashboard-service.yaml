apiVersion: v1
kind: Service
metadata:
  name: smartops-dashboard-service
  namespace: smartops
spec:
  type: LoadBalancer
  selector:
    app: smartops-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501   # Streamlit
    - protocol: TCP
      port: 8000
      targetPort: 8000   # FastAPI event API 