apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartops-monitor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sachinfer/helm-charts
    targetRevision: main
    path: smartops/monitor
    helm:
      values: |
        image:
          repository: us-docker.pkg.dev/sachinfer/smartops-repo/smartops-monitor
          tag: latest
          pullPolicy: Always
        service:
          type: ClusterIP
          port: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
  destination:
    server: https://kubernetes.default.svc
    namespace: smartops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
