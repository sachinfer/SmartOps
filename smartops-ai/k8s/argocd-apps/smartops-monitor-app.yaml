apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartops-monitor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sachinfer/SmartOps.git
    targetRevision: Plotly-Dash
    path: smartops-ai/k8s
    directory:
      include: "monitor-deployment.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: smartops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  revisionHistoryLimit: 10
