apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartops-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sachinfer/helm-charts
    targetRevision: main
    path: smartops/dashboard
    helm:
      values: |
        image:
          repository: us-docker.pkg.dev/sachinfer/smartops-repo/smartops-dashboard
          tag: latest
          pullPolicy: Always
        service:
          type: LoadBalancer
          port: 8000
        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: smartops-dashboard.local
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: smartops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
