apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartops-dashboard
  namespace: smartops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartops-dashboard
  template:
    metadata:
      labels:
        app: smartops-dashboard
      annotations:
        grafana.com/metrics: "true"
        grafana.com/logs: "true"
    spec:
      containers:
      - name: dashboard
        image: smartops-dashboard:latest
        ports:
        - containerPort: 8501
        volumeMounts:
        - name: dashboard-sqlite-storage
          mountPath: /app/dashboard/data
      volumes:
      - name: dashboard-sqlite-storage
        persistentVolumeClaim:
          claimName: dashboard-sqlite-pvc 