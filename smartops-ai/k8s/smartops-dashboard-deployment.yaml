apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartops-dashboard-sa
  namespace: smartops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smartops-dashboard-role
  namespace: smartops
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smartops-dashboard-rolebinding
  namespace: smartops
subjects:
- kind: ServiceAccount
  name: smartops-dashboard-sa
  namespace: smartops
roleRef:
  kind: Role
  name: smartops-dashboard-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartops-dashboard
  namespace: smartops
  labels:
    app: smartops-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartops-dashboard
  template:
    metadata:
      labels:
        app: smartops-dashboard
    spec:
      serviceAccountName: smartops-dashboard-sa
      containers:
      - name: dashboard
        image: us-docker.pkg.dev/icbt-465109/smartops-repo/smartops-dashboard:latest
        ports:
        - containerPort: 8501
        env:
        - name: DASHBOARD_URL
          valueFrom:
            configMapKeyRef:
              name: dashboard-config
              key: DASHBOARD_INTERNAL_URL
        - name: DASHBOARD_EVENT_API
          valueFrom:
            configMapKeyRef:
              name: dashboard-config
              key: EVENT_API_ENDPOINT
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: dashboard-data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: dashboard-data
        persistentVolumeClaim:
          claimName: dashboard-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: smartops-dashboard-service
  namespace: smartops
  labels:
    app: smartops-dashboard
spec:
  type: LoadBalancer
  ports:
  - port: 8501
    targetPort: 8501
    protocol: TCP
  selector:
    app: smartops-dashboard
