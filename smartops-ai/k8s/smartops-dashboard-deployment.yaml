apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartops-dashboard
  namespace: smartops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartops-dashboard
  template:
    metadata:
      labels:
        app: smartops-dashboard
      annotations:
        grafana.com/metrics: "true"
        grafana.com/logs: "true"
    spec:
      containers:
      - name: dashboard
        image: gcr.io/icbt-465109/smartops-dashboard:latest
        ports:
        - containerPort: 4173
      volumes: 