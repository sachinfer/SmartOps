apiVersion: v1
kind: ServiceAccount
metadata:
  name: anomaly-metrics-reader
  namespace: smartops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-pod-metrics
  namespace: smartops
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anomaly-reader-binding
  namespace: smartops
subjects:
  - kind: ServiceAccount
    name: anomaly-metrics-reader
    namespace: smartops
roleRef:
  kind: Role
  name: read-pod-metrics
  apiGroup: rbac.authorization.k8s.io
