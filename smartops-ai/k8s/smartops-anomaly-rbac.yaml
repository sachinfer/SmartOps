apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartops-anomaly-sa
  namespace: smartops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smartops-anomaly-role
  namespace: smartops
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smartops-anomaly-rb
  namespace: smartops
subjects:
- kind: ServiceAccount
  name: smartops-anomaly-sa
  namespace: smartops
roleRef:
  kind: Role
  name: smartops-anomaly-role
  apiGroup: rbac.authorization.k8s.io 