apiVersion: v1
kind: ServiceAccount
metadata:
  name: anomaly-metrics-reader
  namespace: smartops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anomaly-metrics-reader
  namespace: smartops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anomaly-metrics-reader
  namespace: smartops
subjects:
  - kind: ServiceAccount
    name: anomaly-metrics-reader
    namespace: smartops
roleRef:
  kind: Role
  name: anomaly-metrics-reader
  apiGroup: rbac.authorization.k8s.io
