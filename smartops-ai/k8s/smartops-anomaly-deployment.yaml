apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartops-anomaly-deployment
  namespace: smartops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartops-anomaly
  template:
    metadata:
      labels:
        app: smartops-anomaly
      annotations:
        grafana.com/metrics: "true"
        grafana.com/logs: "true"
    spec:
      serviceAccountName: anomaly-metrics-reader  # ✅ Enable metrics access
      containers:
        - name: fastapi
          image: gcr.io/icbt-465109/smartops-anomaly:latest  # ← Replace with your image name if different
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: dashboard-sqlite-storage
              mountPath: /app/dashboard/data
        - name: anomaly-loop
          image: gcr.io/icbt-465109/smartops-anomaly:latest  # ← Use the same image
          imagePullPolicy: Always
          command: ["python", "app/anomaly_loop.py"]
          env:
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_CONTAINER_NAME
              value: fastapi
          volumeMounts:
            - name: dashboard-sqlite-storage
              mountPath: /app/dashboard/data
      volumes:
        - name: dashboard-sqlite-storage
          persistentVolumeClaim:
            claimName: dashboard-sqlite-pvc
