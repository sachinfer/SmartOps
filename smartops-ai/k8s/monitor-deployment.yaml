apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartops-monitor
  namespace: smartops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartops-monitor
  template:
    metadata:
      labels:
        app: smartops-monitor
    spec:
      containers:
      - name: monitor
        image: us-docker.pkg.dev/icbt-465109/smartops-repo/smartops-monitor:latest
        command: ["python", "-u", "monitor_pod_status.py"]
        env:
          - name: DASHBOARD_URL
            valueFrom:
              configMapKeyRef:
                name: dashboard-config
                key: DASHBOARD_INTERNAL_URL 