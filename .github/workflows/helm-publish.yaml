name: Publish Helm Chart to Artifact Hub (via Google Artifact Registry)

on:
  push:
    paths:
      - 'smartops-ai/helm/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-helm-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Google Cloud authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Authenticate Helm with Google Artifact Registry
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > /tmp/key.json
          helm registry login us-docker.pkg.dev \
            -u _json_key \
            -p "$(cat /tmp/key.json)"

      - name: Package Helm chart
        working-directory: ./smartops-ai/helm
        run: |
          helm lint .
          helm package . --destination ./

      - name: Push Helm chart to Google Artifact Registry
        run: |
          CHART_FILE=$(ls smartops-ai/helm/*.tgz)
          helm push $CHART_FILE oci://us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo

      - name: Confirm chart upload
        run: |
          echo "Helm chart uploaded to Artifact Registry!"
