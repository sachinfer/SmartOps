name: Build and Deploy SmartOps App

on:
  push:
    branches:
      - main
      - gcp
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: "gke-gcloud-auth-plugin"

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker us-docker.pkg.dev

      - name: Generate App Image Tag
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build and Push Docker Image to Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:latest
            ${{ env.TAG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubeconfig
        run: |
          gcloud container clusters get-credentials smartops-cluster \
            --zone us-central1-a \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy App to GKE
        run: |
          kubectl get ns smartops || kubectl create ns smartops
          kubectl apply -f k8s/deployment.yaml -n smartops
          kubectl apply -f k8s/service.yaml -n smartops
          kubectl set image deployment/smartops-app smartops-app=${{ env.TAG }} -n smartops
