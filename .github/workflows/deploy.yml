name: Build and Deploy SmartOps App

on:
  push:
    branches:
      - main
      - gcp
  workflow_dispatch:

env:
  REGION: us
  REPOSITORY: smartops-repo
  IMAGE_NAME: smartops-app
  ENVIRONMENT: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev

      - name: Set image tag
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          echo "TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:$SHORT_SHA" >> $GITHUB_ENV
          echo "LATEST_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.TAG }}
            ${{ env.LATEST_TAG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > ~/.kube/config

      - name: Deploy App to GKE
        run: |
          kubectl get ns smartops || kubectl create ns smartops
          kubectl apply -f k8s/deployment.yaml -n smartops
          kubectl apply -f k8s/service.yaml -n smartops
          kubectl set image deployment/smartops-app smartops-app=${{ env.TAG }} -n smartops
