name: Build and Deploy SmartOps App & Anomaly Service

on:
  push:
    branches:
      - main
      - gcp
      - gcp2
      # - dash
      - Plotly-Dash
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      NAMESPACE: smartops
      DOCKER_BUILDKIT: 1
      DOCKER_CLI_EXPERIMENTAL: enabled

    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      #added new telegram
      - name: Notify Telegram - Deployment Started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="🚀 *Production deployment started in namespace `smartops`!*" \
            -d parse_mode=Markdown

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: "gke-gcloud-auth-plugin"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.0
            network=host
          buildkitd-flags: --debug
          # Fallback to local driver if GHA cache fails
          use: true

      - name: Test Network Connectivity
        run: |
          echo "Testing network connectivity..."
          echo "Testing DNS resolution..."
          nslookup us-docker.pkg.dev || echo "DNS resolution failed"
          
          echo "Testing HTTPS connectivity..."
          curl -I --connect-timeout 10 --max-time 30 "https://us-docker.pkg.dev" || echo "HTTPS connection failed"
          
          echo "Testing Google Cloud connectivity..."
          curl -I --connect-timeout 10 --max-time 30 "https://storage.googleapis.com" || echo "Google Cloud connection failed"

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker us-docker.pkg.dev
          # Configure Docker with better timeout settings
          echo '{"registry-mirrors": [], "insecure-registries": [], "debug": true, "experimental": true}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Generate Image Tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "APP_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "ANOMALY_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "DASHBOARD_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build & Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:latest
            ${{ env.APP_TAG }}
        continue-on-error: false

      - name: Build & Push Anomaly Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./smartops-ai
          push: true
          tags: |
            us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:latest
            ${{ env.ANOMALY_TAG }}
        continue-on-error: false

      - name: Build Dashboard Image (Attempt 1)
        uses: docker/build-push-action@v5
        with:
          context: ./smartops-ai/dashboard
          file: ./smartops-ai/dashboard/Dockerfile
          push: false
          tags: |
            us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:latest
            ${{ env.DASHBOARD_TAG }}
          platforms: linux/amd64
          provenance: false
        continue-on-error: true
        id: build-attempt-1

      - name: Build Dashboard Image (Attempt 2 - No Cache)
        if: steps.build-attempt-1.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: ./smartops-ai/dashboard
          file: ./smartops-ai/dashboard/Dockerfile
          push: false
          tags: |
            us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:latest
            ${{ env.DASHBOARD_TAG }}
          platforms: linux/amd64
          provenance: false
          no-cache: true
        continue-on-error: false

      - name: Push Dashboard Image with Retry
        run: |
          # Test connectivity to Artifact Registry
          echo "Testing connectivity to Artifact Registry..."
          curl -I --connect-timeout 10 --max-time 30 "https://us-docker.pkg.dev" || echo "Warning: Direct connection test failed"
          
          # Push with multiple retry attempts
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3..."
            if docker push us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:latest; then
              echo "✅ Push successful on attempt $attempt"
              break
            else
              echo "❌ Push failed on attempt $attempt"
              if [ $attempt -lt 3 ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
              fi
            fi
          done
          
          # Also push the tagged version
          docker push ${{ env.DASHBOARD_TAG }} || echo "Warning: Tagged version push failed"

      - name: Build & Push Monitor Image
        uses: docker/build-push-action@v5
        with:
          context: ./smartops-ai/app
          file: ./smartops-ai/app/Dockerfile.monitor
          push: true
          tags: |
            us-docker.pkg.dev/icbt-465109/smartops-repo/smartops-monitor:latest
        continue-on-error: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubeconfig
        run: |
          gcloud container clusters get-credentials smartops-cluster \
            --zone us-central1-a \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Debug kubectl context
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy Monitor Deployment
        run: |
          kubectl apply -f smartops-ai/k8s/monitor-deployment.yaml -n smartops

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies for event logging
        run: |
          pip install -r smartops-ai/dashboard/requirements.txt

      - name: Ensure data directory exists
        run: mkdir -p smartops-ai/dashboard/data

      - name: Log Deployment Started (to dashboard API)
        run: |
            # Check if dashboard pod exists and is ready
            if kubectl get pods -l app=smartops-dashboard -n smartops --field-selector=status.phase=Running 2>/dev/null | grep -q .; then
              # Check if pod is already ready
              if kubectl get pods -l app=smartops-dashboard -n smartops --field-selector=status.phase=Running -o jsonpath='{.items[0].status.containerStatuses[0].ready}' | grep -q "true"; then
                echo "✅ Dashboard pod is already ready"
              else
                echo "Waiting for dashboard pod to become ready..."
                kubectl wait --for=condition=ready pod -l app=smartops-dashboard -n smartops --timeout=300s
              fi
              
              # Get the external IP of the dashboard service
              DASHBOARD_IP=$(kubectl get service smartops-dashboard-service -n smartops -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              
              if [ -n "$DASHBOARD_IP" ]; then
                echo "Logging deployment start to dashboard at $DASHBOARD_IP"
                # Test dashboard connectivity first
                if curl -s "http://$DASHBOARD_IP:8000/log_event" --max-time 5 > /dev/null 2>&1; then
                  curl -X POST "http://$DASHBOARD_IP:8000/log_event" \
                    -H "Content-Type: application/json" \
                    -d '{"status": "started", "message": "Deployment started", "namespace": "smartops"}' \
                    --max-time 10 || echo "Failed to log to dashboard"
                else
                  echo "Dashboard not responding, skipping external logging"
                fi
              else
                echo "Dashboard service external IP not available yet, skipping event log"
              fi
              
              # Also log to internal service for redundancy
              kubectl exec -n smartops deployment/smartops-dashboard -- curl -X POST "http://localhost:8000/log_event" \
                -H "Content-Type: application/json" \
                -d '{"status": "started", "message": "Deployment started (internal)", "namespace": "smartops"}' \
                --max-time 10 || echo "Internal logging failed"
            else
              echo "Dashboard pod not found yet, skipping event log (will be created during deployment)"
            fi

      # - name: Notify Telegram - Deployment Started
      #   run: |
      #     curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
      #       -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      #       -d text="🚀 *Production deployment started in namespace `smartops`!*" \
      #       -d parse_mode=Markdown

      - name: Deploy to GKE
        run: |
          set -e  # Exit on any error
          
          echo "Starting deployment to GKE..."
          
          # Create namespace if it doesn't exist
          kubectl get ns smartops || kubectl create ns smartops
          echo "✅ Namespace ready"

          # Deploy ConfigMap for dashboard configuration
          kubectl apply -f smartops-ai/k8s/dashboard-config.yaml -n smartops
          echo "✅ ConfigMap deployed"

          # Deploy Main App
          kubectl apply -f k8s/deployment.yaml -n smartops
          kubectl apply -f k8s/service.yaml -n smartops
          kubectl set image deployment/smartops-app smartops-app=${{ env.APP_TAG }} -n smartops
          echo "✅ Main app deployed"

          # Deploy Anomaly Service
          kubectl apply -f smartops-ai/k8s/smartops-anomaly-deployment.yaml -n smartops
          kubectl apply -f smartops-ai/k8s/smartops-anomaly-service.yaml -n smartops
          kubectl set image deployment/smartops-anomaly-deployment fastapi=${{ env.ANOMALY_TAG }} anomaly-loop=${{ env.ANOMALY_TAG }} -n smartops
          echo "✅ Anomaly service deployed"

          # Deploy Dashboard Service
          kubectl apply -f smartops-ai/k8s/smartops-dashboard-deployment.yaml -n smartops
          kubectl set image deployment/smartops-dashboard dashboard=${{ env.DASHBOARD_TAG }} -n smartops
          kubectl apply -f smartops-ai/k8s/smartops-dashboard-pvc.yaml -n smartops
          echo "✅ Dashboard deployed"
          
          echo "🎉 All deployments completed successfully!"

      - name: Wait for Dashboard to be Ready
        if: success()
        run: |
          echo "Checking dashboard status..."
          # Check if pod is already ready first
          if kubectl get pods -l app=smartops-dashboard -n smartops --field-selector=status.phase=Running -o jsonpath='{.items[0].status.containerStatuses[0].ready}' | grep -q "true"; then
            echo "✅ Dashboard pod is already ready"
          else
            echo "Waiting for dashboard pod to become ready..."
            kubectl wait --for=condition=ready pod -l app=smartops-dashboard -n smartops --timeout=300s
            echo "✅ Dashboard pod is ready"
          fi
          
          # Test dashboard connectivity
          DASHBOARD_IP=$(kubectl get service smartops-dashboard-service -n smartops -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -n "$DASHBOARD_IP" ]; then
            echo "Testing dashboard connectivity at $DASHBOARD_IP..."
            if curl -s "http://$DASHBOARD_IP:8000/log_event" --max-time 10 > /dev/null 2>&1; then
              echo "✅ Dashboard is responding"
            else
              echo "⚠️ Dashboard not responding, but continuing..."
            fi
          else
            echo "⚠️ Dashboard IP not available"
          fi

      - name: Notify Telegram - Deployment Success
        if: success()
        run: |
          # Get the external IP of the dashboard service
          DASHBOARD_IP=$(kubectl get service smartops-dashboard-service -n smartops -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          
          if [ -n "$DASHBOARD_IP" ]; then
            echo "Logging success to dashboard at $DASHBOARD_IP"
            curl -X POST "http://$DASHBOARD_IP:8000/log_event" \
              -H "Content-Type: application/json" \
              -d '{"status": "success", "message": "SmartOps AI platform deployment completed successfully - App, Anomaly Detection, Dashboard, and Monitor services deployed", "namespace": "smartops"}' \
              --max-time 10 || echo "Failed to log success to dashboard"
          else
            echo "Dashboard IP not available, skipping dashboard logging"
          fi
          
          # Always send Telegram notification
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ *SmartOps AI Platform Deployment Success!* 🚀%0A%0A*Services Deployed:*%0A• 🖥️ SmartOps App%0A• 🤖 AI Anomaly Detection Service%0A• 📊 Real-time Dashboard%0A• 📡 Monitor Service%0A%0A*Namespace:* \`smartops\`%0A*Commit:* \`${GITHUB_SHA::8}\`%0A*Status:* All services running successfully%0A%0A[📊 Open Dashboard](http://$DASHBOARD_IP)" \
            -d parse_mode=Markdown

      - name: Notify Telegram - Deployment Failed
        if: failure()
        run: |
          # Try to log failure to dashboard if it's available
          DASHBOARD_IP=$(kubectl get service smartops-dashboard-service -n smartops -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          
          if [ -n "$DASHBOARD_IP" ]; then
            echo "Logging failure to dashboard at $DASHBOARD_IP"
            curl -X POST "http://$DASHBOARD_IP:8000/log_event" \
              -H "Content-Type: application/json" \
              -d '{"status": "failed", "message": "Deployment failed - check pipeline logs for details", "namespace": "smartops"}' \
              --max-time 10 || echo "Failed to log to dashboard"
          else
            echo "Dashboard not available, skipping dashboard logging"
          fi
          
          # Always send Telegram notification
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ *Production deployment failed in namespace \`smartops\`!*%0A%0A*Commit:* \`${GITHUB_SHA::8}\`%0A*Check:* [Pipeline Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            -d parse_mode=Markdown

      - name: Always Notify Dashboard of Job Status
        if: always()
        run: |
          # This step always runs, regardless of success/failure
          if [ "${{ job.status }}" == "success" ]; then
            echo "Job completed successfully"
          else
            echo "Job failed or was cancelled"
            # Try to log to dashboard if available
            DASHBOARD_IP=$(kubectl get service smartops-dashboard-service -n smartops -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            
            if [ -n "$DASHBOARD_IP" ]; then
              echo "Logging final status to dashboard at $DASHBOARD_IP"
              curl -X POST "http://$DASHBOARD_IP:8000/log_event" \
                -H "Content-Type: application/json" \
                -d '{"status": "failed", "message": "Pipeline job failed - check GitHub Actions logs", "namespace": "smartops"}' \
                --max-time 10 || echo "Failed to log final status to dashboard"
            fi
          fi
