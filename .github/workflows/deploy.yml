name: Build, Push Images and Update Helm Charts

on:
  push:
    branches: [ main, Plotly-Dash ]
  pull_request:
    branches: [ main, Plotly-Dash ]
  workflow_dispatch:

env:
  REGISTRY: us-docker.pkg.dev
  IMAGE_NAME: smartops-repo
  HELM_CHARTS_REPO: https://github.com/sachinfer/helm-charts.git
  HELM_CHARTS_PATH: smartops

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # Shallow clone for faster checkout

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker for Google Artifact Registry
      run: |
        gcloud auth configure-docker us-docker.pkg.dev --quiet

    - name: Set Image Tags
      id: set-tags
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
        echo "APP_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:$SHORT_SHA" >> $GITHUB_ENV
        echo "ANOMALY_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:$SHORT_SHA" >> $GITHUB_ENV
        echo "DASHBOARD_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:$SHORT_SHA" >> $GITHUB_ENV
        
        # Also set the tags as step outputs for debugging
        echo "app_tag=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "anomaly_tag=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "dashboard_tag=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:$SHORT_SHA" >> $GITHUB_OUTPUT
        
        echo "✅ Image tags set successfully:"
        echo "   SHORT_SHA: $SHORT_SHA"
        echo "   APP_TAG: $APP_TAG"
        echo "   ANOMALY_TAG: $ANOMALY_TAG"
        echo "   DASHBOARD_TAG: $DASHBOARD_TAG"

    - name: Build All Images (Parallel)
      run: |
        echo "🚀 Building all Docker images in parallel..."
        echo "📋 Using image tags:"
        echo "   APP_TAG: ${{ env.APP_TAG }}"
        echo "   ANOMALY_TAG: ${{ env.ANOMALY_TAG }}"
        echo "   DASHBOARD_TAG: ${{ env.DASHBOARD_TAG }}"
        echo "   SHORT_SHA: ${{ env.SHORT_SHA }}"
        
        # Build app image
        docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:latest \
          -t ${{ env.APP_TAG }} \
          --platform linux/amd64 \
          --provenance false \
          . &
        APP_PID=$!
        
        # Build anomaly image
        docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:latest \
          --platform linux/amd64 \
          --provenance false \
          -f ./smartops-ai/Dockerfile \
          ./smartops-ai &
        ANOMALY_PID=$!
        
        # Build dashboard image
        docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:latest \
          --platform linux/amd64 \
          --provenance false \
          -f ./smartops-ai/dashboard/Dockerfile \
          ./smartops-ai/dashboard &
        DASHBOARD_PID=$!
        
        # Build monitor image
        docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-monitor:latest \
          --platform linux/amd64 \
          --provenance false \
          -f ./smartops-ai/app/Dockerfile.monitor \
          ./smartops-ai/app &
        MONITOR_PID=$!
        
        # Wait for all builds to complete
        echo "⏳ Waiting for all builds to complete..."
        wait $APP_PID && echo "✅ App image built successfully" || echo "❌ App image build failed"
        wait $ANOMALY_PID && echo "✅ Anomaly image built successfully" || echo "❌ Anomaly image build failed"
        wait $DASHBOARD_PID && echo "✅ Dashboard image built successfully" || echo "❌ Dashboard image build failed"
        wait $MONITOR_PID && echo "✅ Monitor image built successfully" || echo "❌ Monitor image build failed"
        
        echo "🎉 All Docker builds completed!"

    - name: Quick Push All Images
      run: |
        echo "🚀 Pushing all images with quick timeout strategy..."
        
        # Function for quick push with minimal retry
        quick_push() {
          local image_name=$1
          local max_attempts=2
          
          for attempt in {1..$max_attempts}; do
            echo "Pushing $image_name (attempt $attempt)..."
            if timeout 45 docker push "$image_name"; then
              echo "✅ $image_name pushed successfully!"
              return 0
            else
              echo "❌ Push failed on attempt $attempt"
              if [ $attempt -lt $max_attempts ]; then
                echo "Waiting 3 seconds before retry..."
                sleep 3
              fi
            fi
          done
          echo "⚠️ $image_name push failed, but continuing..."
          return 1
        }
        
        # Push all images quickly
        quick_push "us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:latest" &
        quick_push "us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:latest" &
        quick_push "us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:latest" &
        quick_push "us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-monitor:latest" &
        
        # Wait for all pushes to complete
        wait
        echo "🎉 All image push attempts completed!"

    - name: Checkout Helm Charts Repository
      run: |
        echo "📥 Cloning helm-charts repository for updates..."
        # Configure git to use the user's actual credentials
        git config --global user.name "sachinfer"
        git config --global user.email "sachinnavoda74@gmail.com"
        
        # Clone using the token in the URL
        git clone https://x-access-token:${{ secrets.HELM_CHARTS_TOKEN }}@github.com/sachinfer/helm-charts.git helm-charts
        echo "✅ Helm charts repository cloned successfully"

    - name: Create Helm Charts Structure
      run: |
        cd helm-charts
        
        # Create directory structure
        mkdir -p smartops/{anomaly,dashboard,monitor}
        
        # Create anomaly Chart.yaml
        cat > smartops/anomaly/Chart.yaml << 'EOF'
        apiVersion: v2
        name: smartops-anomaly
        description: SmartOps Anomaly Detection Service
        type: application
        version: 0.1.0
        appVersion: "1.0.0"
        keywords:
          - smartops
          - anomaly
          - detection
          - ai
        home: https://github.com/sachinfer/SmartOps
        sources:
          - https://github.com/sachinfer/SmartOps
        maintainers:
          - name: SmartOps Team
            email: team@smartops.ai
        EOF
        
        # Create dashboard Chart.yaml
        cat > smartops/dashboard/Chart.yaml << 'EOF'
        apiVersion: v2
        name: smartops-dashboard
        description: SmartOps Dashboard Web Application
        type: application
        version: 0.1.0
        appVersion: "1.0.0"
        keywords:
          - smartops
          - dashboard
          - web
          - ui
        home: https://github.com/sachinfer/SmartOps
        sources:
          - https://github.com/sachinfer/SmartOps
        maintainers:
          - name: SmartOps Team
            email: team@smartops.ai
        EOF
        
        # Create monitor Chart.yaml
        cat > smartops/monitor/Chart.yaml << 'EOF'
        apiVersion: v2
        name: smartops-monitor
        description: SmartOps Monitoring Service
        type: application
        version: 0.1.0
        appVersion: "1.0.0"
        keywords:
          - smartops
          - monitor
          - metrics
          - monitoring
        home: https://github.com/sachinfer/SmartOps
        sources:
          - https://github.com/sachinfer/SmartOps
        maintainers:
          - name: SmartOps Team
            email: team@smartops.ai
        EOF
        
        echo "✅ Helm charts structure created successfully!"

    - name: Create and Update Values Files
      run: |
        cd helm-charts
        
        # Create anomaly values.yaml with new image tag
        cat > smartops/anomaly/values.yaml << EOF
        # Default values for smartops-anomaly
        image:
          repository: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly
          tag: "latest"
          pullPolicy: Always
        
        service:
          type: ClusterIP
          port: 8000
        
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        
        replicaCount: 1
        
        # Autoscaling configuration
        autoscaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 1
          targetCPUUtilizationPercentage: 80
        
        # Pod annotations
        podAnnotations: {}
        
        # Image pull secrets
        imagePullSecrets:
          - name: gcp-registry-secret
        
        # Service account configuration
        serviceAccount:
          create: true
          name: ""
        
        # Pod security context
        podSecurityContext: {}
        
        # Container security context
        securityContext: {}
        
        # Environment variables
        env: []
        
        # Node selector
        nodeSelector: {}
        
        # Affinity
        affinity: {}
        
        # Tolerations
        tolerations: []
        EOF
        
        # Create dashboard values.yaml with new image tag
        cat > smartops/dashboard/values.yaml << EOF
        # Default values for smartops-dashboard
        image:
          repository: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard
          tag: "latest"
          pullPolicy: Always
        
        service:
          type: LoadBalancer
          port: 8501
        
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        
        replicaCount: 1
        
        # Autoscaling configuration
        autoscaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 1
          targetCPUUtilizationPercentage: 80
        
        # Pod annotations
        podAnnotations: {}
        
        # Image pull secrets
        imagePullSecrets:
          - name: gcp-registry-secret
        
        # Service account configuration
        serviceAccount:
          create: true
          name: ""
        
        # Pod security context
        podSecurityContext: {}
        
        # Container security context
        securityContext: {}
        
        # Environment variables
        env: []
        
        # Node selector
        nodeSelector: {}
        
        # Affinity
        affinity: {}
        
        # Tolerations
        tolerations: []
        EOF
        
        # Create monitor values.yaml with new image tag
        cat > smartops/monitor/values.yaml << EOF
        # Default values for smartops-monitor
        image:
          repository: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-monitor
          tag: "latest"
          pullPolicy: Always
        
        service:
          type: ClusterIP
          port: 8000
        
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        
        replicaCount: 1
        
        # Autoscaling configuration
        autoscaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 1
          targetCPUUtilizationPercentage: 80
        
        # Pod annotations
        podAnnotations: {}
        
        # Image pull secrets
        imagePullSecrets:
          - name: gcp-registry-secret
        
        # Service account configuration
        serviceAccount:
          create: true
          name: ""
        
        # Pod security context
        podSecurityContext: {}
        
        # Container security context
        securityContext: {}
        
        # Environment variables
        env: []
        
        # Node selector
        nodeSelector: {}
        
        # Affinity
        affinity: {}
        
        # Tolerations
        tolerations: []
        EOF
        
        echo "✅ Values files created with new image tags!"

    - name: Commit and Push to Helm Charts
      run: |
        cd helm-charts
        
        # Configure git user (already done globally, but ensure it's set)
        git config user.name "sachinfer"
        git config user.email "sachinnavoda74@gmail.com"
        
        # Add and commit changes
        git add .
        git commit -m "🤖 Auto-update helm charts with new image tags: ${{ env.SHORT_SHA }}"
        
        # Push using the token authentication
        git push https://x-access-token:${{ secrets.HELM_CHARTS_TOKEN }}@github.com/sachinfer/helm-charts.git main
        
        echo "✅ Helm charts repository updated successfully!"

    - name: Notify Success
      if: success()
      run: |
        echo "🎉 Complete pipeline completed successfully!"
        echo "📦 New image tags:"
        echo "   App: ${{ env.APP_TAG }}"
        echo "   Anomaly: ${{ env.ANOMALY_TAG }}"
        echo "   Dashboard: ${{ env.DASHBOARD_TAG }}"
        echo "   Monitor: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-monitor:${{ env.SHORT_SHA }}"
        echo ""
        echo "🚀 What happened:"
        echo "   1. ✅ Docker images built and pushed to Google Artifact Registry"
        echo "   2. ✅ Helm charts created/updated in separate repository"
        echo "   3. ✅ New image tags applied to helm charts"
        echo "   4. ✅ ArgoCD will automatically detect changes and deploy"
        echo ""
        echo "📚 Helm Charts Repository: ${{ env.HELM_CHARTS_REPO }}"
        echo "🎯 ArgoCD will automatically sync and deploy new versions!"
        echo ""
        echo "🎉 Your deployment process is now fully automated!"
