name: Build and Deploy SmartOps App

on:
  push:
    branches:
      - main
      - gcp
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev  # 👈 Here is the environment tag

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate Docker to GCR
        run: gcloud auth configure-docker

      - name: Generate App Image Tag
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "TAG=gcr.io/${{ secrets.GCP_PROJECT_ID }}/smartops-app:${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build and Push Docker Image to GCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/smartops-app:latest
            ${{ env.TAG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > ~/.kube/config

      - name: Deploy App to GKE
        run: |
          kubectl get ns smartops || kubectl create ns smartops
          kubectl apply -f k8s/deployment.yaml -n smartops
          kubectl apply -f k8s/service.yaml -n smartops
          kubectl set image deployment/smartops-app smartops-app=${{ env.TAG }} -n smartops
