name: Build and Push Images

on:
  push:
    branches: [ main, Plotly-Dash ]
  pull_request:
    branches: [ main, Plotly-Dash ]
  workflow_dispatch:

env:
  REGISTRY: us-docker.pkg.dev
  IMAGE_NAME: smartops-repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # Shallow clone for faster checkout

    - name: Verify Required Secrets
      run: |
        echo "Verifying required secrets..."
        if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
          echo "❌ GCP_PROJECT_ID secret is missing!"
          exit 1
        fi
        if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
          echo "❌ GCP_SA_KEY secret is missing!"
          exit 1
        fi
        echo "✅ All required secrets are available"
        echo "Project ID: [HIDDEN]"
        echo "Service Account Key: [HIDDEN]"

    - name: Test Network Connectivity
      run: |
        echo "Testing network connectivity to Google Cloud..."
        
        # Test DNS resolution
        echo "Testing DNS resolution..."
        nslookup oauth2.googleapis.com || echo "DNS resolution failed"
        nslookup container.googleapis.com || echo "DNS resolution failed"
        
        # Test HTTPS connectivity
        echo "Testing HTTPS connectivity..."
        for endpoint in oauth2.googleapis.com container.googleapis.com; do
          echo "Testing $endpoint..."
          if curl -I --connect-timeout 10 --max-time 30 "https://$endpoint" > /dev/null 2>&1; then
            echo "✅ $endpoint is reachable"
          else
            echo "❌ $endpoint is not reachable"
          fi
        done
        
        echo "Network connectivity test completed"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
      continue-on-error: true

    - name: Retry Google Cloud Authentication
      if: steps.auth.outcome == 'failure'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Fallback Manual Authentication
      if: steps.auth.outcome == 'failure'
      run: |
        echo "Using fallback manual authentication..."
        
        # Create service account key file
        echo '${{ secrets.GCP_SA_KEY }}' > /tmp/service-account.json
        
        # Set environment variable
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
        
        # Test authentication
        gcloud auth activate-service-account --key-file=/tmp/service-account.json || echo "Fallback auth failed"
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }} || echo "Project config failed"
        
        echo "Fallback authentication completed"

    - name: Configure Docker for Google Artifact Registry
      run: |
        gcloud auth configure-docker us-docker.pkg.dev --quiet

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: 'gke-gcloud-auth-plugin'

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure Kubeconfig
      run: |
        echo "Setting up kubectl with project: ${{ secrets.GCP_PROJECT_ID }}"
        
        # Try to get cluster credentials with retry
        for attempt in {1..3}; do
          echo "Attempt $attempt/3: Getting cluster credentials..."
          if gcloud container clusters get-credentials smartops-cluster --zone us-central1-a --project ${{ secrets.GCP_PROJECT_ID }}; then
            echo "✅ Successfully connected to cluster!"
            break
          else
            echo "❌ Attempt $attempt failed"
            if [ $attempt -lt 3 ]; then
              echo "Waiting 10 seconds before retry..."
              sleep 10
            else
              echo "❌ All attempts failed. Exiting..."
              exit 1
            fi
          fi
        done
        
        # Verify kubectl connection
        echo "Verifying kubectl connection..."
        kubectl cluster-info || echo "Warning: kubectl cluster-info failed, but continuing..."
        
        # Test basic kubectl functionality
        echo "Testing kubectl functionality..."
        kubectl get nodes --no-headers | wc -l || echo "Warning: Could not get nodes, but continuing..."
        
        # Fallback: Set up kubectl with direct service account authentication
        echo "Setting up fallback kubectl authentication..."
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
        
        # Create kubeconfig manually if needed
        if ! kubectl get nodes > /dev/null 2>&1; then
          echo "Setting up manual kubeconfig..."
          gcloud container clusters get-credentials smartops-cluster --zone us-central1-a --project ${{ secrets.GCP_PROJECT_ID }} --internal-ip
          
          # Test connection again
          if kubectl get nodes > /dev/null 2>&1; then
            echo "✅ Fallback authentication successful!"
          else
            echo "⚠️ Fallback authentication also failed, but continuing..."
          fi
        fi

    - name: Set Image Tags
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "APP_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:${{ env.SHORT_SHA }}" >> $GITHUB_ENV
        echo "ANOMALY_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:${{ env.SHORT_SHA }}" >> $GITHUB_ENV
        echo "DASHBOARD_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:${{ env.SHORT_SHA }}" >> $GITHUB_ENV

    - name: Build All Images (Parallel)
      run: |
        echo "🚀 Building all Docker images in parallel..."
        
        # Build app image
        docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:latest \
          -t ${{ env.APP_TAG }} \
          --platform linux/amd64 \
          --provenance false \
          . &
        APP_PID=$!
        
        # Build anomaly image
        docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:latest \
          --platform linux/amd64 \
          --provenance false \
          -f ./smartops-ai/Dockerfile \
          ./smartops-ai &
        ANOMALY_PID=$!
        
        # Build dashboard image
        docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:latest \
          --platform linux/amd64 \
          --provenance false \
          -f ./smartops-ai/dashboard/Dockerfile \
          ./smartops-ai/dashboard &
        DASHBOARD_PID=$!
        
        # Build monitor image
        docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-monitor:latest \
          --platform linux/amd64 \
          --provenance false \
          -f ./smartops-ai/app/Dockerfile.monitor \
          ./smartops-ai/app &
        MONITOR_PID=$!
        
        # Wait for all builds to complete
        echo "⏳ Waiting for all builds to complete..."
        wait $APP_PID && echo "✅ App image built successfully" || echo "❌ App image build failed"
        wait $ANOMALY_PID && echo "✅ Anomaly image built successfully" || echo "❌ Anomaly image build failed"
        wait $DASHBOARD_PID && echo "✅ Dashboard image built successfully" || echo "❌ Dashboard image build failed"
        wait $MONITOR_PID && echo "✅ Monitor image built successfully" || echo "❌ Monitor image build failed"
        
        echo "🎉 All Docker builds completed!"

    - name: Quick Push All Images
      run: |
        echo "🚀 Pushing all images with quick timeout strategy..."
        
        # Function for quick push with minimal retry
        quick_push() {
          local image_name=$1
          local max_attempts=2
          
          for attempt in {1..$max_attempts}; do
            echo "Pushing $image_name (attempt $attempt)..."
            if timeout 45 docker push "$image_name"; then
              echo "✅ $image_name pushed successfully!"
              return 0
            else
              echo "❌ Push failed on attempt $attempt"
              if [ $attempt -lt $max_attempts ]; then
                echo "Waiting 3 seconds before retry..."
                sleep 3
              fi
            fi
          done
          echo "⚠️ $image_name push failed, but continuing..."
          return 1
        }
        
        # Push all images quickly
        quick_push "us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:latest" &
        quick_push "us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:latest" &
        quick_push "us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:latest" &
        quick_push "us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-monitor:latest" &
        
        # Wait for all pushes to complete
        wait
        echo "🎉 All image push attempts completed!"

    - name: Update ArgoCD Applications
      run: |
        echo "🔄 Updating ArgoCD applications to use new image tags..."
        
        # Wait for ArgoCD to be ready
        kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd
        
        # Get ArgoCD server pod
        echo "🔍 Looking for ArgoCD server pods..."
        kubectl get pods -n argocd -o wide
        
        # Try multiple selectors to find the ArgoCD server pod
        ARGOCD_POD=$(kubectl get pods -n argocd -l app.kubernetes.io/name=argocd-server -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
        
        if [ -z "$ARGOCD_POD" ]; then
          echo "🔄 Trying alternative selector..."
          ARGOCD_POD=$(kubectl get pods -n argocd -l app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
        fi
        
        if [ -z "$ARGOCD_POD" ]; then
          echo "🔄 Trying to get any ArgoCD pod..."
          ARGOCD_POD=$(kubectl get pods -n argocd --no-headers -o custom-columns=":metadata.name" | grep argocd | head -1)
        fi
        
        # Check if we got a valid pod name
        if [ -z "$ARGOCD_POD" ]; then
          echo "❌ Failed to get ArgoCD pod name"
          echo "🔍 Available pods in argocd namespace:"
          kubectl get pods -n argocd
          echo "🔍 ArgoCD services:"
          kubectl get svc -n argocd
          exit 1
        fi
        
        echo "📦 Using ArgoCD pod: $ARGOCD_POD"
        
        # Get ArgoCD server service IP for internal communication
        ARGOCD_SERVER_IP=$(kubectl get svc -n argocd argocd-server -o jsonpath='{.spec.clusterIP}')
        echo "🌐 ArgoCD Server IP: $ARGOCD_SERVER_IP"
        
        # Login to ArgoCD
        echo "🔐 Logging into ArgoCD server..."
        kubectl exec -n argocd $ARGOCD_POD -- argocd login localhost:8080 --insecure --username admin --password wKuAPSVNLZusO37m
        
        # Update ArgoCD applications to point to helm-charts repository
        echo "🔄 Updating ArgoCD applications to use helm-charts repository..."
        
        # Update dashboard app to use helm-charts repo
        kubectl exec -n argocd $ARGOCD_POD -- argocd app set smartops-dashboard \
          --repo https://github.com/sachinfer/helm-charts \
          --path smartops/dashboard \
          --revision main \
          --values image.tag=${{ env.SHORT_SHA }}
        
        # Update monitor app to use helm-charts repo
        kubectl exec -n argocd $ARGOCD_POD -- argocd app set smartops-monitor \
          --repo https://github.com/sachinfer/helm-charts \
          --path smartops/monitor \
          --revision main \
          --values image.tag=${{ env.SHORT_SHA }}
        
        # Update anomaly app to use helm-charts repo
        kubectl exec -n argocd $ARGOCD_POD -- argocd app set smartops-anomaly \
          --repo https://github.com/sachinfer/helm-charts \
          --path smartops/anomaly \
          --revision main \
          --values image.tag=${{ env.SHORT_SHA }}
        
        echo "✅ ArgoCD applications updated successfully!"
        
        # Sync all applications
        echo "🔄 Syncing all applications..."
        kubectl exec -n argocd $ARGOCD_POD -- argocd app sync smartops-dashboard --prune --timeout 300
        kubectl exec -n argocd $ARGOCD_POD -- argocd app sync smartops-monitor --prune --timeout 300
        kubectl exec -n argocd $ARGOCD_POD -- argocd app sync smartops-anomaly --prune --timeout 300
        
        echo "✅ All applications synced successfully!"

    - name: Notify Deployment
      if: success()
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "📦 New image tags:"
        echo "   App: ${{ env.APP_TAG }}"
        echo "   Anomaly: ${{ env.ANOMALY_TAG }}"
        echo "   Dashboard: ${{ env.DASHBOARD_TAG }}"
        echo "   Monitor: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-monitor:latest"
        echo "🔗 ArgoCD applications updated to use helm-charts repository"
        echo "📚 Helm charts repository: https://github.com/sachinfer/helm-charts"
