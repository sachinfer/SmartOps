name: Build and Deploy SmartOps App & Anomaly Service

on:
  push:
    branches:
      - main
      - gcp
      - gcp2
      # - dash
      - Plotly-Dash
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      NAMESPACE: smartops
      DOCKER_BUILDKIT: 1
      DOCKER_CLI_EXPERIMENTAL: enabled
      # Network configuration
      GITHUB_ACTIONS_RUNNER_EXTRA_LINUX_PRE_INSTALL: |
        echo "nameserver 8.8.8.8" >> /etc/resolv.conf
        echo "nameserver 8.8.4.4" >> /etc/resolv.conf

    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Network Settings
        run: |
          echo "Configuring network settings..."
          
          # Configure DNS resolvers
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf
          
          # Test network connectivity
          echo "Testing basic network connectivity..."
          ping -c 3 8.8.8.8 || echo "Basic network connectivity failed"
          
          # Configure HTTP proxy if needed (uncomment if you have proxy)
          # export HTTP_PROXY=http://proxy.example.com:8080
          # export HTTPS_PROXY=http://proxy.example.com:8080
          
          echo "Network configuration completed"

      #added new telegram
      - name: Notify Telegram - Deployment Started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="🚀 *Production deployment started in namespace `smartops`!*" \
            -d parse_mode=Markdown

      - name: Test Google Cloud Connectivity
        run: |
          echo "Testing Google Cloud connectivity..."
          
          # Test DNS resolution
          echo "Testing DNS resolution..."
          nslookup oauth2.googleapis.com || echo "DNS resolution failed"
          nslookup storage.googleapis.com || echo "DNS resolution failed"
          
          # Test HTTPS connectivity with retries
          echo "Testing HTTPS connectivity to Google Cloud..."
          for i in {1..3}; do
            echo "Attempt $i/3: Testing oauth2.googleapis.com..."
            if curl -I --connect-timeout 10 --max-time 30 "https://oauth2.googleapis.com" > /dev/null 2>&1; then
              echo "✅ oauth2.googleapis.com is reachable"
              break
            else
              echo "❌ Attempt $i failed"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done
          
          # Test storage.googleapis.com
          for i in {1..3}; do
            echo "Attempt $i/3: Testing storage.googleapis.com..."
            if curl -I --connect-timeout 10 --max-time 30 "https://storage.googleapis.com" > /dev/null 2>&1; then
              echo "✅ storage.googleapis.com is reachable"
              break
            else
              echo "❌ Attempt $i failed"
              if [ $i -lt 3 ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            fi
          done

      - name: Authenticate to Google Cloud (with retry)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: Retry Google Cloud Authentication
        if: steps.auth.outcome == 'failure'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK (with retry)
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: "gke-gcloud-auth-plugin"
        continue-on-error: true

      - name: Retry gcloud SDK Setup
        if: steps.gcloud-setup.outcome == 'failure'
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: "gke-gcloud-auth-plugin"

      - name: Fallback Manual Authentication
        if: steps.gcloud-setup.outcome == 'failure'
        run: |
          echo "Using fallback manual authentication..."
          
          # Create service account key file
          echo '${{ secrets.GCP_SA_KEY }}' | base64 -d > /tmp/service-account.json
          
          # Set environment variable
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
          
          # Test authentication
          gcloud auth activate-service-account --key-file=/tmp/service-account.json || echo "Fallback auth failed"
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }} || echo "Project config failed"
          
          echo "Fallback authentication completed"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.0
            network=host
          buildkitd-flags: --debug

      - name: Test Network Connectivity
        run: |
          echo "Testing network connectivity..."
          echo "Testing DNS resolution..."
          nslookup us-docker.pkg.dev || echo "DNS resolution failed"
          
          echo "Testing HTTPS connectivity..."
          curl -I --connect-timeout 10 --max-time 30 "https://us-docker.pkg.dev" || echo "HTTPS connection failed"
          
          echo "Testing Google Cloud connectivity..."
          curl -I --connect-timeout 10 --max-time 30 "https://storage.googleapis.com" || echo "Google Cloud connection failed"

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker us-docker.pkg.dev
          # Configure Docker with better timeout settings
          echo '{"registry-mirrors": [], "insecure-registries": [], "debug": true, "experimental": true}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Generate Image Tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "APP_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "ANOMALY_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "DASHBOARD_TAG=us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build & Push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:latest
            ${{ env.APP_TAG }}
          platforms: linux/amd64
          provenance: false
          outputs: type=docker,dest=/tmp/app-image.tar
        continue-on-error: false

      - name: Test Google Cloud Connectivity (App)
        run: |
          echo "Testing Google Cloud connectivity for app push..."
          for i in {1..3}; do
            echo "Attempt $i: Testing DNS resolution..."
            if nslookup oauth2.googleapis.com && nslookup us-docker.pkg.dev; then
              echo "DNS resolution successful"
              break
            fi
            echo "DNS resolution failed, retrying in 5 seconds..."
            sleep 5
          done
          
          for i in {1..3}; do
            echo "Attempt $i: Testing HTTPS connectivity..."
            if curl -I --connect-timeout 10 --max-time 30 https://oauth2.googleapis.com; then
              echo "HTTPS connectivity successful"
              break
            fi
            echo "HTTPS connectivity failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Push App Image (with retry)
        run: |
          echo "Pushing app image to Google Artifact Registry..."
          
          # Load the image from tar
          docker load < /tmp/app-image.tar
          
          # Retry push with exponential backoff
          for attempt in {1..5}; do
            echo "Push attempt $attempt..."
            
            if docker push us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-app:latest; then
              echo "App image pushed successfully!"
              break
            else
              echo "Push failed on attempt $attempt"
              if [ $attempt -lt 5 ]; then
                wait_time=$((2 ** $attempt))
                echo "Waiting $wait_time seconds before retry..."
                sleep $wait_time
              else
                echo "All push attempts failed"
                exit 1
              fi
            fi
          done
          
          # Also push the tagged version
          echo "Pushing tagged app image..."
          docker push ${{ env.APP_TAG }} || echo "Tagged image push failed, but continuing..."

      - name: Build & Push Anomaly Image
        uses: docker/build-push-action@v5
        with:
          context: ./smartops-ai
          file: ./smartops-ai/Dockerfile
          push: false
          tags: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:latest
          platforms: linux/amd64
          provenance: false
          outputs: type=docker,dest=/tmp/anomaly-image.tar

      - name: Test Google Cloud Connectivity (Anomaly)
        run: |
          echo "Testing Google Cloud connectivity for anomaly push..."
          for i in {1..3}; do
            echo "Attempt $i: Testing DNS resolution..."
            if nslookup oauth2.googleapis.com && nslookup us-docker.pkg.dev; then
              echo "DNS resolution successful"
              break
            fi
            echo "DNS resolution failed, retrying in 5 seconds..."
            sleep 5
          done
          
          for i in {1..3}; do
            echo "Attempt $i: Testing HTTPS connectivity..."
            if curl -I --connect-timeout 10 --max-time 30 https://oauth2.googleapis.com; then
              echo "HTTPS connectivity successful"
              break
            fi
            echo "HTTPS connectivity failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Push Anomaly Image (with retry)
        run: |
          echo "Pushing anomaly image to Google Artifact Registry..."
          
          # Load the image from tar
          docker load < /tmp/anomaly-image.tar
          
          # Retry push with exponential backoff
          for attempt in {1..5}; do
            echo "Push attempt $attempt..."
            
            if docker push us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-anomaly:latest; then
              echo "Anomaly image pushed successfully!"
              break
            else
              echo "Push failed on attempt $attempt"
              if [ $attempt -lt 5 ]; then
                wait_time=$((2 ** $attempt))
                echo "Waiting $wait_time seconds before retry..."
                sleep $wait_time
              else
                echo "All push attempts failed"
                exit 1
              fi
            fi
          done

      - name: Cleanup Temporary Files
        run: |
          echo "Cleaning up temporary image files..."
          rm -f /tmp/*-image.tar
          echo "Cleanup completed"

      - name: Build & Push Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: ./smartops-ai/dashboard
          file: ./smartops-ai/dashboard/Dockerfile
          push: false
          tags: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:latest
          platforms: linux/amd64
          provenance: false
          outputs: type=docker,dest=/tmp/dashboard-image.tar

      - name: Test Google Cloud Connectivity (Dashboard)
        run: |
          echo "Testing Google Cloud connectivity for dashboard push..."
          for i in {1..3}; do
            echo "Attempt $i: Testing DNS resolution..."
            if nslookup oauth2.googleapis.com && nslookup us-docker.pkg.dev; then
              echo "DNS resolution successful"
              break
            fi
            echo "DNS resolution failed, retrying in 5 seconds..."
            sleep 5
          done
          
          for i in {1..3}; do
            echo "Attempt $i: Testing HTTPS connectivity..."
            if curl -I --connect-timeout 10 --max-time 30 https://oauth2.googleapis.com; then
              echo "HTTPS connectivity successful"
              break
            fi
            echo "HTTPS connectivity failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Push Dashboard Image (with retry)
        run: |
          echo "Pushing dashboard image to Google Artifact Registry..."
          
          # Load the image from tar
          docker load < /tmp/dashboard-image.tar
          
          # Retry push with exponential backoff
          for attempt in {1..5}; do
            echo "Push attempt $attempt..."
            
            if docker push us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-dashboard:latest; then
              echo "Dashboard image pushed successfully!"
              break
            else
              echo "Push failed on attempt $attempt"
              if [ $attempt -lt 5 ]; then
                wait_time=$((2 ** $attempt))
                echo "Waiting $wait_time seconds before retry..."
                sleep $wait_time
              else
                echo "All push attempts failed"
                exit 1
              fi
            fi
          done

      - name: Build & Push Monitor Image
        uses: docker/build-push-action@v5
        with:
          context: ./smartops-ai/app
          file: ./smartops-ai/app/Dockerfile.monitor
          push: false
          tags: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-monitor:latest
          platforms: linux/amd64
          provenance: false
          outputs: type=docker,dest=/tmp/monitor-image.tar

      - name: Test Google Cloud Connectivity (Monitor)
        run: |
          echo "Testing Google Cloud connectivity for monitor push..."
          for i in {1..3}; do
            echo "Attempt $i: Testing DNS resolution..."
            if nslookup oauth2.googleapis.com && nslookup us-docker.pkg.dev; then
              echo "DNS resolution successful"
              break
            fi
            echo "DNS resolution failed, retrying in 5 seconds..."
            sleep 5
          done
          
          for i in {1..3}; do
            echo "Attempt $i: Testing HTTPS connectivity..."
            if curl -I --connect-timeout 10 --max-time 30 https://oauth2.googleapis.com; then
              echo "HTTPS connectivity successful"
              break
            fi
            echo "HTTPS connectivity failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Push Monitor Image (with retry)
        run: |
          echo "Pushing monitor image to Google Artifact Registry..."
          
          # Load the image from tar
          docker load < /tmp/monitor-image.tar
          
          # Retry push with exponential backoff
          for attempt in {1..5}; do
            echo "Push attempt $attempt..."
            
            if docker push us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/smartops-repo/smartops-monitor:latest; then
              echo "Monitor image pushed successfully!"
              break
            else
              echo "Push failed on attempt $attempt"
              if [ $attempt -lt 5 ]; then
                wait_time=$((2 ** $attempt))
                echo "Waiting $wait_time seconds before retry..."
                sleep $wait_time
              else
                echo "All push attempts failed"
                exit 1
              fi
            fi
          done

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubeconfig
        run: |
          gcloud container clusters get-credentials smartops-cluster \
            --zone us-central1-a \
            --project ${{ secrets.GCP_PROJECT_ID }}
          
          # Verify connection
          kubectl config current-context
          kubectl get nodes

      - name: Deploy via ArgoCD
        run: |
          echo "🚀 Triggering ArgoCD sync for all applications..."
          
          # Wait for ArgoCD to be ready
          kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n argocd
          
          # Get ArgoCD server pod
          ARGOCD_POD=$(kubectl get pods -n argocd -l app.kubernetes.io/name=argocd-server -o jsonpath='{.items[0].metadata.name}')
          
          # Check if we got a valid pod name
          if [ -z "$ARGOCD_POD" ]; then
            echo "❌ Failed to get ArgoCD pod name"
            exit 1
          fi
          
          echo "📦 Using ArgoCD pod: $ARGOCD_POD"
          
          # Get ArgoCD server service IP for internal communication
          ARGOCD_SERVER_IP=$(kubectl get svc -n argocd argocd-server -o jsonpath='{.spec.clusterIP}')
          echo "🌐 ArgoCD Server IP: $ARGOCD_SERVER_IP"
          
          # Sync all SmartOps applications using kubectl exec with proper ArgoCD CLI configuration
          echo "🔄 Syncing smartops-dashboard..."
          kubectl exec -n argocd $ARGOCD_POD -- argocd app sync smartops-dashboard --server http://$ARGOCD_SERVER_IP:8080 --prune --timeout 300
          
          echo "🔄 Syncing smartops-monitor..."
          kubectl exec -n argocd $ARGOCD_POD -- argocd app sync smartops-monitor --server http://$ARGOCD_SERVER_IP:8080 --prune --timeout 300
          
          echo "🔄 Syncing smartops-anomaly..."
          kubectl exec -n argocd $ARGOCD_POD -- argocd app sync smartops-anomaly --server http://$ARGOCD_SERVER_IP:8080 --prune --timeout 300
          
          echo "✅ ArgoCD sync triggered successfully!"
          
          # Wait for applications to be healthy
          echo "⏳ Waiting for applications to be healthy..."
          kubectl wait --for=condition=healthy --timeout=600s application/smartops-dashboard -n argocd
          kubectl wait --for=condition=healthy --timeout=600s application/smartops-monitor -n argocd
          kubectl wait --for=condition=healthy --timeout=600s application/smartops-anomaly -n argocd
          
          echo "🎉 All applications are healthy!"

      - name: Wait for Dashboard to be Ready
        if: success()
        run: |
          echo "Checking dashboard status..."
          # Check if pod is already ready first
          if kubectl get pods -l app=smartops-dashboard -n smartops --field-selector=status.phase=Running -o jsonpath='{.items[0].status.containerStatuses[0].ready}' | grep -q "true"; then
            echo "✅ Dashboard pod is already ready"
          else
            echo "Waiting for dashboard pod to become ready..."
            kubectl wait --for=condition=ready pod -l app=smartops-dashboard -n smartops --timeout=300s
            echo "✅ Dashboard pod is ready"
          fi
          
          # Test dashboard connectivity
          DASHBOARD_IP=$(kubectl get service smartops-dashboard-service -n smartops -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -n "$DASHBOARD_IP" ]; then
            echo "Testing dashboard connectivity at $DASHBOARD_IP..."
            if curl -s "http://$DASHBOARD_IP:8000/log_event" --max-time 10 > /dev/null 2>&1; then
              echo "✅ Dashboard is responding"
            else
              echo "⚠️ Dashboard not responding, but continuing..."
            fi
          else
            echo "⚠️ Dashboard IP not available"
          fi

      - name: Notify Telegram - Deployment Success
        if: success()
        run: |
          # Get the external IP of the dashboard service
          DASHBOARD_IP=$(kubectl get service smartops-dashboard-service -n smartops -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          
          if [ -n "$DASHBOARD_IP" ]; then
            echo "Logging success to dashboard at $DASHBOARD_IP"
            curl -X POST "http://$DASHBOARD_IP:8000/log_event" \
              -H "Content-Type: application/json" \
              -d '{"status": "success", "message": "SmartOps AI platform deployment completed successfully - App, Anomaly Detection, Dashboard, and Monitor services deployed", "namespace": "smartops"}' \
              --max-time 10 || echo "Failed to log success to dashboard"
          else
            echo "Dashboard IP not available, skipping dashboard logging"
          fi
          
          # Always send Telegram notification
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ *SmartOps AI Platform Deployment Success!* 🚀%0A%0A*Services Deployed:*%0A• 🖥️ SmartOps App%0A• 🤖 AI Anomaly Detection Service%0A• 📊 Real-time Dashboard%0A• 📡 Monitor Service%0A%0A*Namespace:* \`smartops\`%0A*Commit:* \`${GITHUB_SHA::8}\`%0A*Status:* All services running successfully%0A%0A[📊 Open Dashboard](http://$DASHBOARD_IP)" \
            -d parse_mode=Markdown

      - name: Notify Telegram - Deployment Failed
        if: failure()
        run: |
          # Try to log failure to dashboard if it's available
          DASHBOARD_IP=$(kubectl get service smartops-dashboard-service -n smartops -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          
          if [ -n "$DASHBOARD_IP" ]; then
            echo "Logging failure to dashboard at $DASHBOARD_IP"
            curl -X POST "http://$DASHBOARD_IP:8000/log_event" \
              -H "Content-Type: application/json" \
              -d '{"status": "failed", "message": "Deployment failed - check pipeline logs for details", "namespace": "smartops"}' \
              --max-time 10 || echo "Failed to log to dashboard"
          else
            echo "Dashboard not available, skipping dashboard logging"
          fi
          
          # Always send Telegram notification
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ *Production deployment failed in namespace \`smartops\`!*%0A%0A*Commit:* \`${GITHUB_SHA::8}\`%0A*Check:* [Pipeline Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            -d parse_mode=Markdown

      - name: Always Notify Dashboard of Job Status
        if: always()
        run: |
          # This step always runs, regardless of success/failure
          if [ "${{ job.status }}" == "success" ]; then
            echo "Job completed successfully"
          else
            echo "Job failed or was cancelled"
            # Try to log to dashboard if available
            DASHBOARD_IP=$(kubectl get service smartops-dashboard-service -n smartops -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
            
            if [ -n "$DASHBOARD_IP" ]; then
              echo "Logging final status to dashboard at $DASHBOARD_IP"
              curl -X POST "http://$DASHBOARD_IP:8000/log_event" \
                -H "Content-Type: application/json" \
                -d '{"status": "failed", "message": "Pipeline job failed - check GitHub Actions logs", "namespace": "smartops"}' \
                --max-time 10 || echo "Failed to log final status to dashboard"
            fi
          fi
